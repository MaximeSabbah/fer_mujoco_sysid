# Controllers used to play identification protocols on the FER.
#
# Effort mode, deliberately. The robot this model is being identified for is
# driven in effort mode by the deployment stack (sbmpc_ros' linear feedback
# controller), and friction is exactly the term that changes with actuation
# mode: whatever the robot's firmware does internally under a torque command
# — gravity compensation, its own compensations — must be identical during
# identification and during deployment, or the friction identified here is
# not the friction the planner will meet. Identifying under the robot's
# internal position controller and deploying under torque control would
# measure the wrong thing.
#
# The gains are the Agimus FR3 MoveIt configuration's, renamed to the FER
# joints. Integral action is left at zero on purpose: an integrator would
# supply the torque that friction absorbs without that torque ever being
# attributable, and it adds a hidden controller state the fit cannot see.

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_robot_state_broadcaster:
      type: agimus_franka_robot_state_broadcaster/AgimusFrankaRobotStateBroadcaster

    fer_sysid_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Full FCI telemetry: tau_J, tau_J_d, motor-side theta/dtheta, robot mode and
# error flags. Only loadable against real hardware. The player reads the mode
# and error fields during preflight; slice B records the whole message.
franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: fer
    update_rate: 100

fer_sysid_arm_controller:
  ros__parameters:
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    joints:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7

    # u_clamp is the FER's own per-joint torque limit (franka_description
    # robots/fer/joint_limits.yaml). It is defence in depth, not the primary
    # protection: protocols are validated against these limits before they are
    # written, and the first hardware run is time-scaled down. What it guards
    # against is the PID itself demanding a large effort after an unexpected
    # tracking error.
    gains:
      fer_joint1: {p: 600., d: 30., i: 0., antiwindup_strategy: none, u_clamp_max: 87., u_clamp_min: -87.}
      fer_joint2: {p: 600., d: 30., i: 0., antiwindup_strategy: none, u_clamp_max: 87., u_clamp_min: -87.}
      fer_joint3: {p: 600., d: 30., i: 0., antiwindup_strategy: none, u_clamp_max: 87., u_clamp_min: -87.}
      fer_joint4: {p: 600., d: 30., i: 0., antiwindup_strategy: none, u_clamp_max: 87., u_clamp_min: -87.}
      fer_joint5: {p: 250., d: 10., i: 0., antiwindup_strategy: none, u_clamp_max: 12., u_clamp_min: -12.}
      fer_joint6: {p: 150., d: 10., i: 0., antiwindup_strategy: none, u_clamp_max: 12., u_clamp_min: -12.}
      fer_joint7: {p: 50., d: 5., i: 0., antiwindup_strategy: none, u_clamp_max: 12., u_clamp_min: -12.}

    # A runaway aborts the goal instead of finishing the protocol. The
    # trajectory tolerance is what stops a diverging joint; it is well above
    # the friction-limited steady-state error a gainless-integral PID leaves
    # (worst case ~11 mrad on joint 7) and well below anything alarming.
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 2.0
      fer_joint1: {trajectory: 0.2, goal: 0.05}
      fer_joint2: {trajectory: 0.2, goal: 0.05}
      fer_joint3: {trajectory: 0.2, goal: 0.05}
      fer_joint4: {trajectory: 0.2, goal: 0.05}
      fer_joint5: {trajectory: 0.2, goal: 0.05}
      fer_joint6: {trajectory: 0.2, goal: 0.05}
      fer_joint7: {trajectory: 0.2, goal: 0.05}

    interpolation_method: splines
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: false
    open_loop_control: false
    action_monitor_rate: 20.0
