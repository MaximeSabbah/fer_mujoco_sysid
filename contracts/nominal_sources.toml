contract_version = 1

# The nominal model this project identifies. It is VENDORED at
# models/panda/panda.xml so identification never depends on, and can never be
# perturbed by, a sibling checkout: the fit measures deviations *from* this
# file, so it must not live in a repository that also receives the fit's
# output. `repository`/`revision`/`path` record where the copy came from, for
# provenance only — nothing reads that repository at runtime.
[models.hydrax]
role = "identification_baseline"
vendored_path = "models/panda/panda.xml"
repository = "https://github.com/MaximeSabbah/hydrax.git"
revision = "bdc4db9c249733c145f18eb5517b18e8c0e0c8b3"
path = "hydrax/models/panda/panda.xml"
sha256 = "7e8dfc2155ff5b87a10599b4b27b4aa000058e88fb9585aa803e6cb797f902d9"
