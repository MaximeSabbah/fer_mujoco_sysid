[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "fer-mujoco-sysid"
version = "0.1.0"
description = "MuJoCo system identification for the FER robot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.23,<5",
    # Protocol/report plots and the MuJoCo review videos are produced by the
    # project itself, so these are declared rather than relied on
    # transitively through mujoco[sysid].
    "imageio>=2.37,<3",
    "imageio-ffmpeg>=0.6,<1",
    "matplotlib>=3.10,<4",
    "mujoco[sysid]==3.10.0",
    "numpy>=2.0,<3",
    "scipy>=1.15,<2",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.15.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "slow: multi-minute optimizer-driven fits (run with ./scripts/test-all)",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
